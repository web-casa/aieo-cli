name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-13, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p aieo-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="aieo-${GITHUB_REF_NAME}-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "./$dir/aieo.exe" README.md LICENSE
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" -C "$dir" aieo -C "$GITHUB_WORKSPACE" README.md LICENSE
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: aieo-v*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" aieo-v* --repo "$GITHUB_REPOSITORY" --generate-notes
