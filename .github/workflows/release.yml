name: release

# Push a tag `vX.Y.Z` (matching Cargo.toml's version) to build and publish:
# GitHub release assets (+ .sha256), the agent skills, an MCP Bundle and its
# MCP Registry entry (server.json; listed only when the repository variable
# MCP_REGISTRY_PUBLISH is "true"), npm packages (@aieo/cli and one per
# platform; needs the NPM_TOKEN secret) and the Homebrew formula in
# web-casa/homebrew-tap (needs the HOMEBREW_TAP_TOKEN secret). Without a
# secret its job is skipped, not failed.

on:
  push:
    tags: ["v*.*.*"]   # not the moving major tag (v1) the Action is used by

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: matrix.musl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Version matches the tag
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$want" = "$have" ] || { echo "::error::tag $GITHUB_REF_NAME but Cargo.toml has $have"; exit 1; }
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.musl }}" = "true" ]; then
            export CC_$(echo "${{ matrix.target }}" | tr '-' '_')=musl-gcc
          fi
          cargo build --release --locked -p aieo-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="aieo-${GITHUB_REF_NAME}-${{ matrix.target }}"
          dir="target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp README.md LICENSE "$dir/"
            (cd "$dir" && 7z a "$GITHUB_WORKSPACE/$name.zip" aieo.exe README.md LICENSE >/dev/null)
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" -C "$dir" aieo -C "$GITHUB_WORKSPACE" README.md LICENSE
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/aieo"
          "$bin" --version
          "$bin" check -C fixtures/presets/hugo --site https://example.com --format json > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: aieo-v*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp plugins/aieo/skills/aieo/SKILL.md assets/SKILL.md
          (cd plugins/aieo && zip -qr ../../assets/aieo-skills.zip skills)
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --generate-notes

  mcpb:
    # one cross-platform MCP Bundle (universal macOS binary via lipo) + server.json
    needs: publish
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node packaging/mcpb/build.mjs "${GITHUB_REF_NAME#v}" assets mcpb-out
          gh release upload "$GITHUB_REF_NAME" mcpb-out/*.mcpb mcpb-out/*.mcpb.sha256 mcpb-out/server.json --repo "$GITHUB_REPOSITORY"

  mcp-registry:
    # lists the bundle in the official MCP Registry as io.github.<owner>/aieo;
    # runs only when the repository variable MCP_REGISTRY_PUBLISH is "true"
    needs: mcpb
    if: vars.MCP_REGISTRY_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" -p server.json
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json

  npm:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN is not set; skipping npm"; exit 0; fi
          node packaging/npm/build.mjs "${GITHUB_REF_NAME#v}" assets npm-out
          # platform packages first, so the launcher's optional dependencies resolve
          for d in npm-out/cli-*; do (cd "$d" && npm publish --access public --provenance); done
          (cd npm-out/cli && npm publish --access public --provenance)
    permissions:
      contents: read
      id-token: write

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew"; exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/web-casa/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sh packaging/homebrew/render.sh "$version" assets "$GITHUB_REPOSITORY" > tap/Formula/aieo.rb
          cd tap
          git config user.name "aieo release"
          git config user.email "release@aieo.ee"
          git add Formula/aieo.rb
          git commit -m "aieo $version"
          git push
