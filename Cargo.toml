[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/web-casa/aieo-cli"
homepage = "https://aieo.ee"

[workspace.dependencies]
aieo-core = { path = "crates/aieo-core" }
aieo-site = { path = "crates/aieo-site" }
aieo-rules = { path = "crates/aieo-rules" }
aieo-report = { path = "crates/aieo-report" }
aieo-logs = { path = "crates/aieo-logs" }
aieo-search = { path = "crates/aieo-search" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1"
globset = "0.4"
markdown = "1.0.0"
percent-encoding = "2"
rayon = "1"
regex = "1"
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
toml = "0.9"
url = "2"
walkdir = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
ipnet = "2.12"
dns-lookup = "4"
getrandom = "0.4"
base64 = "0.22"
ring = "0.17"
rpassword = "7.5"
rmcp = { version = "3.6", features = ["server", "macros", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["rt", "io-std"] }
jsonschema = { version = "0.59", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
